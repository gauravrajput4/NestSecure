<body class="bg-background flex flex-col min-h-full">
<!-- TopNavBar Suppressed as per "Semantic Shell" Mandate: Linear/Transactional intent -->
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center relative w-full px-margin-mobile md:px-margin-desktop py-xl">
<!-- Subtle Gradient Background Element -->
<div class="absolute inset-0 z-0 bg-gradient-to-br from-surface to-primary-fixed opacity-50 pointer-events-none"></div>
<div class="relative z-10 w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-surface-container-high p-lg md:p-xl flex flex-col gap-lg">
<div class="text-center flex flex-col gap-xs">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Login to manage your bookings and properties.</p>
</div>
<!-- Role Selector (Segmented Toggle) -->
<div class="flex bg-surface-container-high rounded-lg p-base">
<button class="flex-1 py-xs rounded-md bg-surface-container-lowest shadow-sm font-label-md text-label-md text-on-surface text-center transition-all">User</button>
<button class="flex-1 py-xs rounded-md font-label-md text-label-md text-on-surface-variant hover:text-on-surface text-center transition-all">Owner</button>
</div>
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs relative">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-xs font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 transition-shadow" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-xs relative">
<div class="flex justify-between items-center w-full">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-xs font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 transition-shadow" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex items-center gap-xs">
<input class="rounded border-outline-variant text-primary focus:ring-primary-container h-4 w-4" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant" for="remember">Keep me signed in</label>
</div>
<button class="w-full bg-primary-container hover:bg-[#4338CA] text-on-primary font-title-md text-title-md py-sm rounded-lg shadow-sm scale-100 active:scale-98 transition-all duration-200 mt-xs" type="submit">
                    Sign In
                </button>
</form>
<div class="text-center font-label-md text-label-md text-on-surface-variant">
                Don't have an account? <a class="text-primary hover:text-primary-container transition-colors underline" href="#">Register</a>
</div>
</div>
</main>
<!-- Footer Suppressed as per "Semantic Shell" Mandate: Linear/Transactional intent -->
</body></html>
